name: Backup database mingguan

on:
  schedule:
    - cron: "0 19 * * 0" # Setiap Senin 02:00 WIB (Minggu 19:00 UTC)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: mysqldump
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          MYSQL_PWD="$DB_PASSWORD" mysqldump \
            -h "$DB_HOST" -P "${DB_PORT:-4000}" -u "$DB_USER" \
            --ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/ssl/certs/ca-certificates.crt \
            --single-transaction --no-tablespaces --set-gtid-purged=OFF \
            "$DB_NAME" | gzip > "arsindo-db-$STAMP.sql.gz"
          ls -lh arsindo-db-*.sql.gz
      - name: Simpan sebagai artifact (90 hari)
        uses: actions/upload-artifact@v4
        with:
          name: arsindo-db-backup
          path: arsindo-db-*.sql.gz
          retention-days: 90
